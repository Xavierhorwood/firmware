; The 1.0 release of the TBEAM board 
[env:tbeam-ipv6]
extends = esp32v6_base
board = ttgo-t-beam
board_check = true
lib_deps =
  ${esp32v6_base.lib_deps}
build_flags = 
  ${esp32v6_base.build_flags} -D TBEAM_V10  -I variants/tbeam-ipv6
  -DGPS_POWER_TOGGLE ; comment this line to disable double press function on the user button to turn off gps entirely.
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
upload_speed = 921600