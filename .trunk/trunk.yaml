version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - renovate@44.35.3
    - prettier@3.9.6
    - trufflehog@3.97.0
    - yamllint@1.38.0
    - bandit@1.9.4
    - trivy@0.74.0
    - taplo@0.10.0
    - ruff@0.16.3
    - isort@8.0.1
    - markdownlint@0.49.1
    - oxipng@10.2.0
    - svgo@4.0.2
    - actionlint@1.7.12
    - flake8@7.3.0
    - hadolint@2.15.1
    - shfmt@3.13.1
    - shellcheck@0.11.0
    - black@26.5.1
    - git-diff-check
    - gitleaks@8.30.1
    - clang-format@20.1.0
  ignore:
    - linters: [ALL]
      paths:
        - bin/**
runtimes:
  enabled:
    - python@3.14.4
    - go@1.21.0
    - node@22.16.0
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
